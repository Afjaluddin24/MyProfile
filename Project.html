<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="col-12 col-md-12 m-auto">
            <div class="row">
                <div class="col-12 col-md-10 bg-primary m-auto py-3">
                    <div class="row align-items-center">
                        <div class="col-12 col-md-6 mb-2 mb-md-0">
                            <a href="index.html">
                                <button type="button" class="btn btn-success">Back</button>
                            </a>
                        </div>
                        <div class="col-12 col-md-6 text-center text-md-start">
                            <b>Garment Inventory Management System</b><br>
                            <b>BCA Sem-6 Project 2025</b>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-10 m-auto mt-3">
                    <div class="row">
                        <div class="col-12 text-center">
                             <b>Project Images</b>
                        </div>
                        <div class="col-12 mt-3">
                            <div class="row justify-content-center g-3">
                                <!-- Image list -->
                                <div class="col-12 col-md-4">
                                    <img src="./assets/img/project/Projectone_1.png" alt="Project 1" class="img-fluid rounded project-img" style="cursor:pointer;">
                                </div>
                                <div class="col-12 col-md-4">
                                    <img src="./assets/img/project/Projectone_2.png" alt="Project 2" class="img-fluid rounded project-img" style="cursor:pointer;">
                                </div>
                                <div class="col-12 col-md-4">
                                    <img src="./assets/img/project/Projectone_3.png" alt="Project 3" class="img-fluid rounded project-img" style="cursor:pointer;">
                                </div>
                                <div class="col-12 col-md-4">
                                    <img src="./assets/img/project/Projectone_4.png" alt="Project 4" class="img-fluid rounded project-img" style="cursor:pointer;">
                                </div>
                                <div class="col-12 col-md-4">
                                    <img src="./assets/img/project/Projectone_5.png" alt="Project 5" class="img-fluid rounded project-img" style="cursor:pointer;">
                                </div>
                                <div class="col-12 col-md-4">
                                    <img src="./assets/img/project/Projectone_6.png" alt="Project 6" class="img-fluid rounded project-img" style="cursor:pointer;">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
           </div>
        </div>
    </div>

    <!-- Modal for Zoom -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-body p-0">
            <img src="" class="img-fluid w-100" id="modalImage" alt="Zoomed Image">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script>
        // Select all project images
        const projectImages = document.querySelectorAll('.project-img');
        const modalImage = document.getElementById('modalImage');

        projectImages.forEach(img => {
            img.addEventListener('click', () => {
                modalImage.src = img.src; // Set clicked image src to modal
            });
        });
    </script>

</body>
</html>
