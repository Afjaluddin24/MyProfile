<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project</title>
<link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<style>
/* Gallery images */
.project-img {
    cursor: pointer;
    transition: transform 0.3s ease;
}

.project-img:hover {
    transform: scale(1.05);
}

/* Fullscreen overlay */
.img-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
    box-sizing: border-box;
}

.img-overlay:target {
    display: flex;
}

/* Zoomed image */
.img-overlay img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 8px;
    box-shadow: 0 0 20px #000;
    transition: transform 0.3s ease;
}

/* Close button */
.img-overlay a.close-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 30px;
    color: white;
    text-decoration: none;
    font-weight: bold;
}
.img-overlay a.close-btn:hover {
    color: #ddd;
}
</style>
</head>
<body>
<div class="container-fluid">
    <div class="col-12 col-md-12 m-auto">
        <div class="row">
            <div class="col-12 col-md-10 bg-primary m-auto py-3">

                        </a>
                    </div>
                    <div class="col-12 col-md-6 text-center text-md-start">
                        <b>Garment Inventory Management System</b><br>
                        <b>BCA Sem-6 Project 2025</b>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-10 m-auto mt-3">
                <div class="row">
                    <div class="col-12 text-center">
                         <b>Project Images</b>
                    </div>
                    <div class="col-12 mt-3">
                        <div class="row justify-content-center g-3">
                            <!-- Gallery -->
                            <div class="col-12 col-md-4">
                                <a href="#img1"><img src="./assets/img/project/Projectone_1.png" class="img-fluid rounded project-img"></a>
                            </div>
                            <div class="col-12 col-md-4">

                            </div>
                            <div class="col-12 col-md-4">
                                <a href="#img5"><img src="./assets/img/project/Projectone_5.png" class="img-fluid rounded project-img"></a>
                            </div>
                            <div class="col-12 col-md-4">
                                <a href="#img6"><img src="./assets/img/project/Projectone_6.png" class="img-fluid rounded project-img"></a>

                    </div>

            </div>
       </div>

</div>
